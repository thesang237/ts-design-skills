      "after": "Short recipe: draw the outline as one SVG path at the button's real size (ResizeObserver), corner as a cubic whose control points interpolate between a straight 45° line and a quarter circle (k 1 → 0); tween k on hover (~0.5 s in-out); fill and text colour switch instantly; focus gets the same state. Note: `clip-path` removes the border along the cut.",
      "evidence": ["E8", "E15", "E31"], "options": null
    },
    {
      "id": "R12", "kind": "technique", "size": "M",
      "target": "plugins/page-transitions/skills/page-transitions/references/page-loader.md",
      "section": "new variant after 'the hand-over loader'",
      "title": "Variant: loader → opening sequence",
      "why": "The loader handing off into a short logo opening is a strong first impression, and the blank beat between them was easy to miss.",
      "before": "(new variant)",
      "after": "'The loader only clears the screen; an opening plays: a pattern wipe fills the screen while the wordmark builds in masked pieces left to right, a slit opens into the hero card, the wordmark turns white over the picture (a white copy clipped to the opening card) and breaks apart, then the page text arrives. Start the opening while the loader's last details fade (no blank beat). Once per session; reduced motion skips it.'",

    },
    {

      "target": "plugins/reference-match/ (new skill, plugin.json, marketplace entry, README row)",

      "title": "New skill: reference-match (rebuild a page from a recording)",
      "why": "Three clones now used the same workflow by hand; a skill makes the next one faster and more exact.",
      "before": "(no owner: parts are scattered across 3d-web, quality-check and memory)",
      "after": "Description: 'Use when rebuilding or matching a page from a screen recording, saved HTML and assets.' Rules: 1) Measure, never eyeball: layout values come from pixels of the reference (card bounds, rules, type height, in the page's own unit). 2) After every change, compare side by side at the same moment (contact sheets from the recording, screenshots at the same film time, pointer pairs for parallax, fast captures for hover). 3) Identify every asset before wiring it (debug views for scenes, sprite sheets, textures). First reference file: the toolkit (ffmpeg tile sheets, a Playwright screenshot script with film time and pointer options, a pixel-measuring snippet), plus 'generated art cut with the reference's own masks'.",
      "evidence": ["E26", "E27", "E28", "E29", "E30", "E31", "E33"], "options": null
    },
    {
      "id": "R14", "kind": "memory", "size": "S",
      "target": "memory/design-skills-repo.md (thesang-port line)",
      "section": "thesang-port dev server",
      "title": "Use your running dev server; never kill broadly",
      "why": "Twice the dev server got in the way: one I stopped by accident, one of yours on another port.",
      "before": "Its dev server on port 3100 may already be running from another chat.",
      "after": "'Your own dev server may already be running (seen on port 3000): check which port answers and reuse it; never stop processes by a broad name pattern.'",

  "watch": [
    "quality-check is still a placeholder (TODO text, no trigger, no date). Not a lesson from this page; worth building in its own session (E32).",
    "Scripted find-and-replace edits matched the wrong anchor twice; caught by type-check (E19). Mine to watch, not a skill rule.",
    "rm with an unguarded shell variable is blocked by a safety check; use \"${D:?}\" (E21). Environment detail.",
    "Hidden preview pane and GPU flags for headless screenshots are already covered in 3d-web pitfalls and the earlier configurator list."
  ]

<script>
(() => {
  const data = JSON.parse(document.getElementById('retro-data').textContent);
  const app = document.getElementById('app');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const KINDS = [['corrected', 'Corrected', 'What the designer changed'], ['broke', 'Broke', 'Errors and false “done”'], ['slow', 'Slow', 'Retries, waits, detours'], ['worked', 'Worked', 'Worth keeping']];
  const evById = Object.fromEntries((data.evidence || []).map((e) => [e.id, e]));
  const skillOf = (p) => (p.target || '').match(/plugins\/([^/]+)/)?.[1] || (p.kind === 'memory' ? 'memory' : p.kind === 'project-note' ? 'project notes' : 'other');
  const skills = [...new Set((data.proposals || []).map(skillOf))];
  const picked = new Set();
  let filter = 'all';

  const findings = KINDS.map(([k, label, hint]) => {
    const items = data.findings?.[k] || [];
    return `<div class="kind" style="--c: var(--${k})"><h3>${label}</h3>${items.length ? `<ul>${items.map((i) => `<li>${esc(i)}</li>`).join('')}</ul>` : `<p class="empty">Nothing found. (${hint})</p>`}</div>`;
  }).join('');

  const card = (p) => {
    const ev = (p.evidence || []).map((id) => `<span class="chip ev" title="${esc(evById[id]?.text || '')}">${esc(id)}</span>`).join('');
    const opts = Array.isArray(p.options) && p.options.length ? `<ul class="opts">${p.options.map((o) => `<li class="${o.recommended ? 'rec' : ''}">${esc(o.label)}${o.recommended ? ' · recommended' : ''}${o.description ? ` — <span class="path">${esc(o.description)}</span>` : ''}</li>`).join('')}</ul>` : '';
    const isNew = !p.before || /^\((new|not set)/i.test(p.before);
    const diff = p.before || p.after ? `<div class="diff">${isNew ? `<span class="newtag">${esc(p.before || '(new)').replace(/[()]/g, '')}</span>` : `<pre class="del">${esc(p.before)}</pre>`}${p.after ? `<pre class="add">${esc(p.after)}</pre>` : ''}</div>` : '';
    return `<article class="card" data-id="${esc(p.id)}" data-skill="${esc(skillOf(p))}">
      <div class="card-head">
        <input class="pick" type="checkbox" aria-label="Select ${esc(p.id)}" data-pick="${esc(p.id)}" />
        <div style="min-width:0">
          <h4>${esc(p.title)}</h4>
          <div class="meta"><span class="chip id">${esc(p.id)}</span><span class="chip">${esc(p.kind)}</span><span class="chip">size ${esc(p.size || 'S')}</span><span class="chip">${esc(skillOf(p))}</span>${ev}</div>
        </div>
      </div>
      <p class="why">${esc(p.why)}</p>
      <div class="path">${esc(p.target || '')}${p.section ? ' → ' + esc(p.section) : ''}</div>
      ${diff}${opts}
    </article>`;
  };

  const render = () => {
    const list = (data.proposals || []).filter((p) => filter === 'all' || skillOf(p) === filter);
    app.innerHTML = `
      <div class="eyebrow">Skill retro · ${esc(data.date)}</div>
      <h1>${esc(data.project)}</h1>
      <p class="lead">${esc(data.summary)}</p>
      ${data.stats?.length ? `<div class="stats">${data.stats.map((s) => `<div class="stat"><b>${esc(s.value)}</b><span>${esc(s.label)}</span></div>`).join('')}</div>` : ''}
      <section><h2>What happened</h2><div class="kinds">${findings}</div></section>
      <section>
        <h2>Proposed changes <span class="path">(${(data.proposals || []).length})</span></h2>
        <div class="toolbar" role="toolbar" aria-label="Filter by skill">
          ${['all', ...skills].map((s) => `<button class="filter" type="button" aria-pressed="${filter === s}" data-filter="${esc(s)}">${esc(s)}</button>`).join('')}
        </div>
        <div class="cards">${list.map(card).join('') || '<p class="empty">No proposals.</p>'}</div>
      </section>
      ${data.watch?.length ? `<section class="watch"><h2>Watch (not promoted yet)</h2><ul>${data.watch.map((w) => `<li>${esc(w)}</li>`).join('')}</ul></section>` : ''}
      <section><h2>Evidence</h2><div class="ev-list">${(data.evidence || []).map((e) => `<div class="ev-item"><span class="chip" style="align-self:start;background:var(--${esc(e.kind)});color:var(--bg)">${esc(e.id)}</span><div>${esc(e.text)}<div class="src">${esc(e.kind)} · ${esc(e.source)}</div></div></div>`).join('')}</div></section>`;
    app.querySelectorAll('[data-pick]').forEach((el) => {
      el.checked = picked.has(el.dataset.pick);
      el.closest('.card').classList.toggle('is-picked', el.checked);
    });
  };

  const sync = () => {
    const bar = document.getElementById('approve');
    const ids = (data.proposals || []).map((p) => p.id).filter((id) => picked.has(id));
    bar.hidden = !ids.length;
    document.getElementById('approve-text').textContent = `Apply ${ids.join(', ')}`;
  };

  app.addEventListener('change', (e) => {
    const id = e.target.dataset?.pick;
    if (!id) return;
    e.target.checked ? picked.add(id) : picked.delete(id);
    e.target.closest('.card').classList.toggle('is-picked', e.target.checked);
    sync();
  });
  app.addEventListener('click', (e) => {
    const f = e.target.dataset?.filter;
    if (!f) return;
    filter = f;
    render();
  });
  document.getElementById('copy').addEventListener('click', async (e) => {
    try { await navigator.clipboard.writeText(document.getElementById('approve-text').textContent); e.target.textContent = 'Copied'; setTimeout(() => (e.target.textContent = 'Copy'), 1400); } catch { /* clipboard blocked: select the text instead */ }
  });
  document.title = `Retro · ${data.project}`;
  render();
})();
</script>
</body>
</html>
